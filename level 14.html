<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find the button!</title>
</head>
<body style="background-color: black;">
    <p id="level text"style="font-family: arial; font-size: 50px;position: absolute; top: -50px; left: 575px; color: white;">LEVEL 14</p>
    <p  id="question" style="display: block; font-family: arial; font-size: 50px;position: absolute; top: 75px; left: 471.25px; color: white;">where's the switch ?</p>
    <p id="answer" style="display: none; font-family: arial; font-size: 50px;position: absolute; top: 75px; left: 575px; color: rgb(0, 0, 0);"> there it is!</p>
    <button style="position: absolute; top: 529px; left: 462px; width: 30px; height: 30px; background-color: black; border: 0px;"></button>
<a href="level 15.html">
    <button id="buttontp" style="display: none;">WAH IM SO SCARED OF THE DARK</button>
</a>
    <script>
        const button = document.querySelector('button');
        const question = document.getElementById('question');
        const answer = document.getElementById('answer');
        const levelText = document.getElementById('level text');
        const buttontp = document.getElementById('buttontp');

        button.addEventListener('click', () => {
            question.style.display = 'none';
            answer.style.display = 'block';
            document.body.style.backgroundColor = 'white';
            levelText.style.color = 'black';
            button.style.backgroundColor = 'white';
            button.style.border = '1px solid black';
            buttontp.style.display = 'block';
        });
    </script>
</body>
</html>
