<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        body {
            position: relative;
        }

        #myIframe {
            position: absolute;
            bottom: 0;
            left: 17.5%;
            width: 67.5%;
            height: 67.5%;
            border: none;
            background: #ffffff;
        }

        #fullscreenBtn {
            width: 50px;
            height: 50px;
            position: absolute;
            bottom: 450px;
            right: 625px;
            cursor: pointer;
            background: #ffffff;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <a href="https://www.youtube.com/@thefuryboss99" target="_blank">
        <img src="Logo-Youtube-PNG-Image-HD-180x180.png" style="width: 50px; height: 50px; position: absolute; top: 25px;">
    </a>
    <a href="https://www.tiktok.com/@thefuryboss99" target="_blank">
        <img src="logo-tiktok-icone-512.webp" style="width: 50px; height: 50px; position: absolute; top: 25px; left: 60px;">
    </a>
    <p style="position: absolute; top: 0px; left:25px; font-family: 'Courier New', Courier, monospace; font-size: 10px;">thefuryboss99</p>
    <iframe id="myIframe" src="https://world-s-hardest-find-the-button-gam.vercel.app/level 0.html" title="Game frame" style="position: absolute; bottom:50px; left: 17.5%; width: 67.5%; height: 67.5%;"></iframe>
    <img src="full-screen.svg" id="fullscreenBtn" alt="Full screen button" style="position: absolute; top:100px;">
    <script>
document.getElementById("fullscreenBtn").addEventListener("click", function () {
    const iframe = document.getElementById("myIframe");

    // Check if Fullscreen API is supported
    if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
    } else if (iframe.mozRequestFullScreen) { // Firefox
        iframe.mozRequestFullScreen();
    } else if (iframe.webkitRequestFullscreen) { // Chrome, Safari, Opera
        iframe.webkitRequestFullscreen();
    } else if (iframe.msRequestFullscreen) { // IE/Edge
        iframe.msRequestFullscreen();
    } else {
        alert("Fullscreen API is not supported by your browser.");
    }
});
</script>
</body>
</html>
