<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find the button!</title>
        <style>
    </style>
</head>
<body>
    <p style="font-family: arial; font-size: 50px;position: absolute; top: -50px; left: 575px;">LEVEL 15</p>
    <p style="font-family: arial; font-size: 50px;position: absolute; top: 25px; left: 500px;">be on beat to 15!</p>
    <button id="buttonsync" style="height: 50px; width: 100px; position: absolute; top: 150px; left: 645px;"></button>
    <canvas id="beatCanvas" style="width: 100px; height: 50px;background-color: blue; position: absolute; top: 575px; left: 645px;"></canvas>
    <p>score: <span id="scoreDisplay">0</span></p>
    <script>
        const button = document.getElementById('buttonsync');
        const canvas = document.getElementById('beatCanvas');
        const ctx = canvas.getContext('2d');
        let beatInterval = 1000; // Time between beats in milliseconds
        let lastBeatTime = 0;
        let score = 0;
        //makes the beat move upwards to the button, and when it touches the button,increases score if the player clicks on beat
        function drawBeat() {
            const currentTime = Date.now();
            const timeSinceLastBeat = currentTime - lastBeatTime;
            if (timeSinceLastBeat >= beatInterval) {
                lastBeatTime = currentTime;
            }
            const beatY = 575 - (timeSinceLastBeat / beatInterval) * 525; // Move from 575 to 50
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'red';
            ctx.fillRect(0, beatY, 300, 50);
            requestAnimationFrame(drawBeat);
        }
        drawBeat();
        button.addEventListener('click', () => {
            const currentTime = Date.now();
            const timeSinceLastBeat = currentTime - lastBeatTime;
            if (timeSinceLastBeat >= beatInterval - 100 && timeSinceLastBeat <= beatInterval + 100) {
                score++;
                document.getElementById('scoreDisplay').textContent = score;
            }
        });
        // this punishes the player for spamming the button by decreasing score if they click when there is no beat but never reaches negatives
        button.addEventListener('click', () => {
            const currentTime = Date.now();
            const timeSinceLastBeat = currentTime - lastBeatTime;
            if (timeSinceLastBeat < beatInterval - 100 || timeSinceLastBeat > beatInterval + 100) {
                score--;
                if (score < 0) {
                    score = 0;
                }
                document.getElementById('scoreDisplay').textContent = score;
            }
        }); 
        //this teleports the player to the next level if they get a score of 15
        button.addEventListener('click', () => {
            if (score >= 15) {
                window.location.href = 'level 16.html';
            }
        });
    </script>
</body>
</html>
